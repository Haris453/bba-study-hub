
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b25">
  <title>Admin Login | BBA Study Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102b25, #176b50);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0003;
    }

    .brand {
      margin-bottom: 25px;
      color: #176b50;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      color: #153d30;
      font-size: 29px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #68756f;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      color: #243b32;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd7d1;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #176b50;
      box-shadow: 0 0 0 3px #176b501c;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #176b50;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #10523d;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    #message {
      display: none;
      margin: 16px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      color: #9b1c1c;
      background: #fff0f0;
    }

    #message.success {
      display: block;
      color: #176b50;
      background: #eaf7ef;
    }

    .back-link {
      display: inline-block;
      margin-top: 12px;
      color: #176b50;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      color: #89948e;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">BBA Study Hub</div>

    <h1>Admin Login</h1>
    <p class="subtitle">
      Sign in to manage assignments, chapters and study resources.
    </p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        name="email"
        autocomplete="username"
        placeholder="Enter admin email"
        maxlength="254"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        maxlength="200"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <p id="message" role="alert" aria-live="polite"></p>
    </form>

    <a class="back-link" href="index.html">
      &larr; Back to website
    </a>

    <div class="footer">
      BBA Study Hub &copy; 2026
    </div>
  </main>

  <script>
   const API_URL = "http://127.0.0.1:4000";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      message.className = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch(
          `${API_URL}/api/admin/login`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value
            })
          }
        );

        const responseText = await response.text();
        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            `Server returned an unexpected response (HTTP ${response.status}).`
          );
        }

        if (!response.ok) {
          throw new Error(data.error || "Login failed.");
        }

        if (data.authenticated !== true) {
          throw new Error(
            "The server verified a response but did not confirm an authenticated session."
          );
        }

        showMessage("Login successful. Opening dashboard...", "success");

        window.location.href = "admin.html";

      } catch (error) {
        if (error instanceof TypeError) {
          showMessage(
            "Cannot connect to the backend. Check that the API is running on port 4000 and that CORS allows this website."
          );
        } else {
          showMessage(error.message || "An unexpected error occurred.");
        }

        console.error("Admin login error:", error);

      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
